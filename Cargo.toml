# Workspace manifest for agents-first-toolkit.
#
# Five single-purpose, pure-Rust CLI tools that batch agent tool calls
# into one tool call:
#
#   crates/shellaborate   agentic-shell  - batch shell/git/gh DAG
#   crates/patchify       agentic-edit   - batch edits + writes + verify
#   crates/curlosity      agentic-web    - batch web search + fetch + HTML→Markdown
#   crates/readcursively  agentic-code   - batch regex search + file read
#   crates/recurlsively   agentic-web    - recursive domain → Markdown
#
# Each crate is also a standalone workspace root (own [workspace] table),
# so it builds on its own or as a member of this monorepo.

[workspace]
resolver = "2"
members = [
    "crates/shellaborate",
    "crates/patchify",
    "crates/curlosity",
    "crates/readcursively",
    "crates/recurlsively",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/riceharvest/agents-first-toolkit"
keywords = ["agentic", "hermes", "batch", "tool"]
categories = ["development-tools"]

[workspace.dependencies]
# Shared across all crates. Add a dependency here once, and every crate
# that needs it picks it up via `dep = { workspace = true }`.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "http2", "json"] }
sha2 = "0.10"
url = "2.5"
flate2 = "1"
tar = "0.4"
glob = "0.3"
globset = "0.4"
regex = "1"
rayon = "1"
ignore = "0.4"
scraper = "0.22"
ego-tree = "0.6"
htmd = "0.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
